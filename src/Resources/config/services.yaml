services:

  Micayael\Bundle\FormGeneratorBundle\Service\ConstraintFactory: ~

  Micayael\Bundle\FormGeneratorBundle\Service\FormGenerator:
    arguments:
      $formFactory: '@form.factory'
      $constraintFactory: '@Micayael\Bundle\FormGeneratorBundle\Service\ConstraintFactory'

  Micayael\Bundle\FormGeneratorBundle\Service\FormGeneratorInterface: '@Micayael\Bundle\FormGeneratorBundle\Service\FormGenerator'

  micayael.form_generator:
    alias: Micayael\Bundle\FormGeneratorBundle\Service\FormGenerator
    public: true
