name: CI

on:
  push:
    branches: [ "master", "2.0" ]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}${{ matrix.dependencies == 'lowest' && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', symfony: '5.4.*', dependencies: 'lowest' }
          - { php: '8.1', symfony: '5.4.*' }
          - { php: '8.2', symfony: '6.4.*' }
          - { php: '8.3', symfony: '6.4.*' }
          - { php: '8.2', symfony: '7.4.*' }
          - { php: '8.4', symfony: '7.4.*' }
          - { php: '8.4', symfony: '8.*' }
          - { php: '8.5', symfony: '8.*' }

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: flex

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        with:
          dependency-versions: ${{ matrix.dependencies || 'highest' }}
          composer-options: "--prefer-dist"

      - name: Run test suite
        run: vendor/bin/phpunit

  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - name: Run test suite with coverage
        run: vendor/bin/phpunit --coverage-filter src --coverage-clover var/coverage/clover.xml

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
